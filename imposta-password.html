<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imposta password – Cortocircuito</title><meta name="robots" content="noindex">
<style>body{font:15px system-ui;background:#0f1419;color:#e6edf3;max-width:680px;margin:30px auto;padding:0 16px}
input,button,textarea{font:inherit;padding:8px;border-radius:6px;border:1px solid #2a3643;background:#1d2630;color:#e6edf3;width:100%;margin:6px 0}
button{background:#4da3ff;color:#04111f;font-weight:600;cursor:pointer}textarea{height:160px;font-family:monospace}</style></head>
<body><h1>Imposta la password</h1>
<p>Scegli una nuova password: la pagina genera il blocco da incollare in <code>js/config.js</code>. La password non lascia mai il tuo computer.</p>
<input id="pw" type="password" placeholder="Nuova password (min. 12 caratteri)" autocomplete="new-password">
<button id="go">Genera</button>
<textarea id="out" readonly placeholder="Il risultato apparirà qui"></textarea>
<script>
const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
document.getElementById('go').onclick=async()=>{
 const pw=document.getElementById('pw').value; if(pw.length<12){alert('Usa almeno 12 caratteri');return;}
 const salt=hex(crypto.getRandomValues(new Uint8Array(12))), enc=new TextEncoder(), it=100000;
 const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const h=hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:it,hash:'SHA-256'},k,256));
 document.getElementById('out').value='window.APP_CONFIG = {\n  salt: "'+salt+'",\n  iterations: '+it+',\n  hash: "'+h+'"\n};\n';
};
</script></body></html>
